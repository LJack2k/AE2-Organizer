# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod_id=ae2organizer
mod_name=TerminalOrganizer
mod_license=MIT
mod_version=1.3.0
mod_group_id=nl.ljack2k.ae2organizer
mod_authors=LJack2k
# Loader for this branch - read by the release workflows so each MC line publishes
# with the correct loader tag (neoforge here; forge on the 1.20.1 line).
mod_loaders=neoforge
mod_description=Adds user-defined filter tabs to Applied Energistics 2 terminals and Refined Storage 2 grids. Create tabs that filter storage by mod, item tag, name, or data-component (NBT) criteria, then switch between them with one click. Each storage system keeps its own independent tabs. Fully client-side; both AE2 and Refined Storage are optional.

# Minecraft / NeoForge - verify at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.76
neo_version_range=[26.1,)
loader_version_range=[4,)
# Java toolchain for this MC line (1.21.x = 21; 26.1+ = 25). Read by BOTH the
# Gradle toolchain (neoforge/build.gradle) and the release workflows, so a new
# MC line sets the JDK in exactly one place.
java_version=25

# AE2 — one of two OPTIONAL storage backends (the other is Refined Storage). We
# hook AE2's internal client terminal classes (Repo, MEStorageScreen) via mixin,
# gated on ae2 being present. Version range pinned tight (internals aren't API).
# Bump ae2_curse_file_id from the CurseForge file page's "Curse Maven Snippet".
ae2_version=26.1.10-beta
ae2_curse_file_id=8257570
ae2_version_range=[26.1,26.2)
# guideme is a transitive runtime dep of AE2 (its in-game docs library).
guideme_curse_file_id=8204880

# Refined Storage 2 — the other OPTIONAL storage backend. We hook RS2's client
# grid internals (AbstractGridContainerMenu) via mixin, gated on refinedstorage
# being present. refined-storage CurseForge project id = 243076.
rs_version=3.2.1
rs_curse_file_id=8211383
rs_version_range=[3.0,4.0)

# JEI — DEV ONLY convenience (item search + cheat-spawn in runClient). Not a
# dependency of the mod and never bundled into the jar. Bump from the JEI
# CurseForge file page's "Curse Maven Snippet".
jei_curse_file_id=8014757
