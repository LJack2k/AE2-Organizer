plugins {
    id 'java-library'
    // ModDevGradle's legacyforge plugin — supports MinecraftForge up to 1.20.1.
    // (The 1.21.1/26.1 lines use the regular 'net.neoforged.moddev' plugin; this
    // line targets Forge, so it uses the legacy variant. Same plugin version.)
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

java {
    // Driven by java_version in gradle.properties so the toolchain and the
    // release workflow can never drift (1.20.1 = 17, 1.21.x = 21, 26.1+ = 25).
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

base {
    // The subproject dir is historically 'neoforge'; this line builds a Forge jar.
    // The loader token comes from mod_loaders so the artifact name matches the loader
    // the release workflows publish under (forge here, neoforge on 1.21.1 / 26.1).
    archivesName = "${mod_name}-${mod_loaders}-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // CurseMaven — single source for AE2 + guideme + JEI. Coordinate format:
    //   curse.maven:<slug>-<projectId>:<fileId>
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Local jars fallback.
    flatDir { dirs 'libs' }
}

legacyForge {
    version = forge_version

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            programArguments.addAll '--width', '1920', '--height', '1000'
        }
        // Auto-joining dev client + dedicated server for the RCON/screenshot harness
        // (dev-only; enabled by the ae2organizer.devHarness system property). Separate
        // game dirs so client/server don't contend on world/log locks.
        clientJoin {
            client()
            gameDirectory = file('run-client')
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'ae2organizer.devHarness', 'true'
            jvmArguments.addAll '-Xmx4G'
            programArguments.addAll '--width', '1920', '--height', '1000',
                    '--quickPlayMultiplayer', '127.0.0.1:25565'
        }
        server {
            server()
            gameDirectory = file('run-server')
            systemProperty 'ae2organizer.devHarness', 'true'
            programArgument '--nogui'
            jvmArguments.addAll '-Xmx4G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Mixin refmap generation (top-level extension registered by the legacyforge
// plugin). Our mixins target a vanilla class (AbstractContainerScreen#imageWidth/
// Height) whose fields are SRG-obfuscated in production, so a refmap is mandatory
// on 1.20.1 (unlike the AE2-only mixins, which use AE2's unobfuscated names). The
// Mixin annotation processor (added in dependencies) reads this config to emit the
// refmap + the reobf mappings the reobfJar task consumes.
mixin {
    add sourceSets.main, 'ae2organizer.refmap.json'
    config 'ae2organizer.ae2.mixins.json'
    config 'ae2organizer.rslegacy.mixins.json'
}

dependencies {
    // Mixin annotation processor — the legacyforge plugin wires the refmap config
    // above but does NOT add the processor itself, so declare it explicitly.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // AE2 is required — we hook its client terminal internals. guideme is a
    // REQUIRED runtime dep of AE2 1.20.1 that our code never touches. CurseForge
    // jars ship SRG-mapped, so the mod* configurations remap them to official
    // (Mojang) mappings for the dev compile/runtime.
    modCompileOnly "curse.maven:applied-energistics-2-223794:${ae2_curse_file_id}"
    // -PnoAe2 drops AE2 (and its guideme runtime dep) from the DEV RUNTIME only, so the
    // load-safety guarantee — the jar loads with either, both or neither storage mod — can
    // actually be exercised. compileOnly is untouched, so the build is unaffected.
    if (!project.hasProperty('noAe2')) {
        modRuntimeOnly "curse.maven:applied-energistics-2-223794:${ae2_curse_file_id}"
        modRuntimeOnly "curse.maven:guideme-1173950:${guideme_curse_file_id}"
    }

    // Refined Storage 1.12 — the OPTIONAL second backend on this line (see
    // gradle.properties: 1.20.1 only ever had the pre-rewrite RS, so this backend
    // is separate from the RS2 one the newer lines use).
    modCompileOnly "curse.maven:refined-storage-243076:${rs_curse_file_id}"
    // -PnoRs — the RS half of the same load-safety switch (see -PnoAe2 above).
    if (!project.hasProperty('noRs')) {
        modRuntimeOnly "curse.maven:refined-storage-243076:${rs_curse_file_id}"
    }

    // JEI — OPTIONAL integration. modCompileOnly builds the @JeiPlugin ghost-drag
    // handler (drag items from JEI onto the tab editor); the plugin class stays
    // dormant unless JEI is actually present at runtime, and JEI is not declared
    // as a dependency in mods.toml. modRuntimeOnly also puts JEI on the dev client
    // for item search / cheat-spawn / drag testing.
    modCompileOnly "curse.maven:jei-238222:${jei_curse_file_id}"
    // -PnoJei — same idea as -PnoAe2/-PnoRs. Matters when testing the client-only
    // guarantee against a server without the loader: that only holds for a client where
    // EVERY loaded mod is vanilla-compatible. (Forge 1.20.1 turns out to allow the join
    // even with AE2/RS/JEI present; NeoForge 1.21.1+ refuses it, so the newer lines need
    // all three dropped. The flag exists here for parity.)
    if (!project.hasProperty('noJei')) {
        modRuntimeOnly "curse.maven:jei-238222:${jei_curse_file_id}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        loader_version_range    : loader_version_range,
        ae2_version_range       : ae2_version_range,
        rs_version_range        : rs_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_display_name        : mod_display_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
