plugins {
    id 'java-library'
    // ModDevGradle — the modern way to develop NeoForge mods. 2.x is required
    // for the 26.1 line (Gradle 9 / Java 25).
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

java {
    // Driven by java_version in gradle.properties so the toolchain and the
    // release workflow can never drift (1.21.x = 21, 26.1+ = 25).
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // CurseMaven — single source for AE2 + guideme. Coordinate format:
    //   curse.maven:<slug>-<projectId>:<fileId>
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Local jars fallback.
    flatDir { dirs 'libs' }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            programArguments.addAll '--width', '1920', '--height', '1000'
        }
        // Auto-joining dev client + dedicated server for the RCON/screenshot harness
        // (dev-only; enabled by the ae2organizer.devHarness system property). Separate
        // game dirs so client/server don't contend on world/log locks.
        clientJoin {
            client()
            gameDirectory = file('run-client')
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'ae2organizer.devHarness', 'true'
            jvmArguments.addAll '-Xmx4G'
            programArguments.addAll '--width', '1920', '--height', '1000',
                    '--quickPlayMultiplayer', 'localhost:25565'
        }
        server {
            server()
            gameDirectory = file('run-server')
            systemProperty 'ae2organizer.devHarness', 'true'
            programArgument '--nogui'
            jvmArguments.addAll '-Xmx4G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // AE2 is required — we hook its client terminal internals. guideme is a
    // transitive runtime dep AE2 needs but our code never touches, so it's
    // runtimeOnly with no compileOnly counterpart.
    compileOnly "curse.maven:applied-energistics-2-223794:${ae2_curse_file_id}"
    // -PnoAe2 drops AE2 (and its guideme runtime dep) from the DEV RUNTIME only, so the
    // load-safety guarantee — the jar loads with either, both or neither storage mod — can
    // actually be exercised. compileOnly is untouched, so the build is unaffected.
    if (!project.hasProperty('noAe2')) {
        runtimeOnly "curse.maven:applied-energistics-2-223794:${ae2_curse_file_id}"
        runtimeOnly "curse.maven:guideme-1173950:${guideme_curse_file_id}"
    }

    // Refined Storage 2 — the other optional backend. compileOnly to build the RS
    // hooks; runtimeOnly so the dev client can exercise RS grids alongside AE2.
    compileOnly "curse.maven:refined-storage-243076:${rs_curse_file_id}"
    // -PnoRs — the RS half of the same load-safety switch (see -PnoAe2 above).
    if (!project.hasProperty('noRs')) {
        runtimeOnly "curse.maven:refined-storage-243076:${rs_curse_file_id}"
    }

    // JEI — OPTIONAL integration. compileOnly builds the @JeiPlugin ghost-drag
    // handler (drag items from JEI onto the tab editor); the plugin class stays
    // dormant unless JEI is actually present at runtime, and JEI is not declared
    // as a dependency in neoforge.mods.toml. runtimeOnly also puts JEI on the dev
    // client for item search / cheat-spawn / drag testing.
    compileOnly "curse.maven:jei-238222:${jei_curse_file_id}"
    // -PnoJei — same idea as -PnoAe2/-PnoRs. Needed to test the client-only guarantee
    // (joining a server without NeoForge): that only holds for a client where EVERY
    // loaded mod is vanilla-compatible, so AE2/RS/JEI all have to be dropped first.
    if (!project.hasProperty('noJei')) {
        runtimeOnly "curse.maven:jei-238222:${jei_curse_file_id}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        loader_version_range    : loader_version_range,
        ae2_version_range       : ae2_version_range,
        rs_version_range        : rs_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_display_name        : mod_display_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
