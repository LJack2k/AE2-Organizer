modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"
logoBlur = true
# Client-only mod: it does nothing server-side and must not break the version
# handshake when joining a server that doesn't have it installed.
displayTest = "IGNORE_ALL_VERSION"

# Mixin configs — one per backend. Each config's MixinConfigPlugin gates its
# mixins on the target mod being present (LoadingModList check), so a missing
# storage mod's mixins are skipped instead of crashing. FML reads these entries
# at load time; the dev run additionally passes them via --mixin.config, which
# is wired from the mixin { } block in neoforge/build.gradle.
[[mixins]]
config = "ae2organizer.ae2.mixins.json"

[[mixins]]
config = "ae2organizer.rslegacy.mixins.json"

# --- Required ---
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# AE2 — OPTIONAL and CLIENT-side. One of two storage backends; when present we
# hook AE2's client terminal internals via the ae2 mixin config. The jar loads
# cleanly without it (backend + mixins self-gate). Tight version range: AE2
# internals are not public API, so the backend is only enabled on a tested line.
[[dependencies.${mod_id}]]
modId = "ae2"
mandatory = false
versionRange = "${ae2_version_range}"
ordering = "AFTER"
side = "CLIENT"

# Refined Storage — OPTIONAL and CLIENT-side. The other storage backend. This is
# RS 1.12 (1.20.1 never got RS2), hooked via the rslegacy mixin config. Tight
# version range: RS internals are not public API either.
[[dependencies.${mod_id}]]
modId = "refinedstorage"
mandatory = false
versionRange = "${rs_version_range}"
ordering = "AFTER"
side = "CLIENT"

