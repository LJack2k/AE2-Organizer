modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"
logoBlur = true
# Client-only mod: it does nothing server-side and must not break the version
# handshake when joining a server that doesn't have it installed.
displayTest = "IGNORE_ALL_VERSION"

# Mixin configs — one per backend. Each config's MixinConfigPlugin gates its
# mixins on the target mod being present (ModList check), so a missing storage
# mod's mixins are skipped instead of crashing. FML reads these at load time
# (dev and production); no extra Gradle wiring is required.
[[mixins]]
config = "ae2organizer.ae2.mixins.json"

[[mixins]]
config = "ae2organizer.rs.mixins.json"

# --- Required ---
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# AE2 — OPTIONAL and CLIENT-side. One of two storage backends; when present we
# hook AE2's client terminal internals via the ae2 mixin config. The jar loads
# cleanly without it (backend + mixins self-gate). Tight version range: AE2
# internals are not public API, so we only enable the backend on a tested line.
[[dependencies.${mod_id}]]
modId = "ae2"
type = "optional"
versionRange = "${ae2_version_range}"
ordering = "AFTER"
side = "CLIENT"

# Refined Storage 2 — OPTIONAL and CLIENT-side. The other storage backend; when
# present we hook RS's client grid internals via the rs mixin config. Tight
# version range: RS internals are not public API.
[[dependencies.${mod_id}]]
modId = "refinedstorage"
type = "optional"
versionRange = "${rs_version_range}"
ordering = "AFTER"
side = "CLIENT"
